onboarding = false

######## THEMING ########

[theme]
# Start with dracula then override it
name = "dracula"

auto_switch = false
# Dracula Pro — my goto theme
[theme.custom]
# panel_bg = "reset"
sidebar_bg = "#191820" # Dracula Pro sidebar
active_row_bg = "#312e3f" # bg2 — cursor line
selection_bg = "#454158" # bg3 — visual selection

surface0 = "#312e3f" # bg2 — subtle dividers
surface1 = "#454158" # bg3 — borders, focus ring
surface_dim = "#23222d" # bg1 — popups, inactive chrome
overlay0 = "#6e6a8c" # fg3 — inactive foreground
overlay1 = "#7970a9" # comment — dim foreground

text = "#ffffff" # fg1 — active foreground
subtext0 = "#b5b0ce" # fg2 — statusline foreground

accent = "#8aff80" # green
red = "#ff9580"
green = "#8aff80"
yellow = "#ffff80"
peach = "#ffca80" # orange
blue = "#9580ff" # purple
mauve = "#ff80bf" # pink
teal = "#80ffea" # cyan

####### UI ########

[ui]
accent = "#9580ff"
agent_panel_sort = "spaces"
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

######## KEYBINDING ########

[keys]
prefix = "ctrl+a"
goto = "prefix+g"
new_tab = "prefix+t"
next_tab = ["prefix+n", "ctrl+alt+cmd+]"]
previous_tab = ["prefix+p", "ctrl+alt+cmd+["]

######## PLUGINS ########

### WORKTRUNK ###


# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

### REVIEWR ####

# Shortcut for herdr-review
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name
